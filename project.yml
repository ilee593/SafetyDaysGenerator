name: SafetyDays
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  SafetyDays:
    type: application
    platform: iOS
    sources:
      - path: SafetyDays
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.SafetyDays
        INFOPLIST_FILE: SafetyDays/Info.plist
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    info:
      path: SafetyDays/Info.plist
      properties:
        CFBundleDisplayName: 安全天数
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
