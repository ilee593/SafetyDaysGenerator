name: SafetyDaysGenerator

# 项目级配置
options:
  bundleIdPrefix: com.safetydays
  deploymentTarget:
    iOS: "16.0"          # iPhone X 最高支持 iOS 16
  createIntermediateGroups: true
  defaultConfig: Release
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"          # 仅 iPhone
    DEVELOPMENT_TEAM: ""                 # 不需要(交给 Actions)
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  SafetyDaysGenerator:
    type: application
    platform: iOS
    sources:
      - path: SafetyDaysGenerator
        excludes:
          - "Info.plist"            # Info.plist 用 INFOPLIST_FILE 单独指定
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.safetydays.app
        INFOPLIST_FILE: SafetyDaysGenerator/Info.plist
        PRODUCT_NAME: SafetyDaysGenerator
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_ASSET_PATHS: '"SafetyDaysGenerator/Preview Content"'
        SWIFT_EMIT_LOC_STRINGS: "YES"
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
