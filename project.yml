name: SafetyDays

options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:

  SafetyDays:
    type: application
    platform: iOS

    sources:
      - path: SafetyDays
        excludes:
          - "Info.plist"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.safetydays.generator"
        INFOPLIST_FILE: "SafetyDays/Info.plist"
        PRODUCT_NAME: "SafetyDays"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: "Manual"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        # XcodeGen 默认注入 ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon，
        # 但 Assets.xcassets 里没 AppIcon.appiconset，actool 报错。
        # 显式设为空字符串关闭它（TrollStore 对没 icon 的 IPA 也接受）。
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""

      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"

        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
