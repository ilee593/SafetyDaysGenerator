name: Build SafetyDays IPA

on:
  # 手动触发(推荐,改完代码点一下就编译)
  workflow_dispatch:
  # 推送到 main 时自动编译
  push:
    branches: [main]
  # PR 也编译(用于检查能不能过编译)
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA (TrollStore Compatible)
    runs-on: macos-14        # GitHub 提供的 macOS Sonoma runner,自带 Xcode 15

    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: xcodegen generate --spec project.yml

      - name: 编译 (无签名,供 TrollStore 安装)
        run: |
          set -o pipefail
          xcodebuild \
            -project SafetyDaysGenerator.xcodeproj \
            -scheme SafetyDaysGenerator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: 打包为 IPA
        run: |
          APP_PATH=$(find build -name "SafetyDaysGenerator.app" -path "*Release-iphoneos*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 没找到编译产物"
            find build -name "*.app" -type d
            exit 1
          fi
          echo "✅ 找到 App: $APP_PATH"
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -r ../SafetyDaysGenerator.ipa Payload -q
          cd ..
          ls -lh SafetyDaysGenerator.ipa

      - name: 上传 IPA 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SafetyDaysGenerator-IPA
          path: SafetyDaysGenerator.ipa
          if-no-files-found: error
          retention-days: 90

      - name: 打印完成信息
        if: success()
        run: |
          echo ""
          echo "============================================="
          echo "  ✅ IPA 已生成!"
          echo "  📦 下载:本页面底部 Artifacts → SafetyDaysGenerator-IPA"
          echo "  📲 安装:把 IPA 用 AirDrop / 网盘传到 iPhone,共享给 TrollStore 即可"
          echo "============================================="
