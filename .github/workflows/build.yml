name: Build SafetyDays IPA

on:

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  build:

    name: Build iOS IPA

    runs-on: macos-15-intel

    steps:

      # --------------------------------------------------
      # 1. 下载 GitHub 仓库
      # --------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. 显示环境
      # --------------------------------------------------

      - name: Show build environment
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "Swift:"
          swift --version

      # --------------------------------------------------
      # 3. 安装 XcodeGen
      # --------------------------------------------------

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      # --------------------------------------------------
      # 4. 检查 XcodeGen
      # --------------------------------------------------

      - name: Check XcodeGen
        run: |
          xcodegen version

      # --------------------------------------------------
      # 5. 检查项目文件
      # --------------------------------------------------

      - name: Check project files
        run: |
          echo "Project:"
          find . -maxdepth 3 -type f | sort

      # --------------------------------------------------
      # 6. 生成 Xcode 工程
      # --------------------------------------------------

      - name: Generate Xcode project
        run: |
          xcodegen generate

      # --------------------------------------------------
      # 7. 检查工程
      # --------------------------------------------------

      - name: Check generated project
        run: |
          ls -la
          ls -la SafetyDays.xcodeproj

      # --------------------------------------------------
      # 8. 清理
      # --------------------------------------------------

      - name: Clean build
        run: |
          xcodebuild \
            -project SafetyDays.xcodeproj \
            -scheme SafetyDays \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean

      # --------------------------------------------------
      # 9. 编译
      # --------------------------------------------------

      - name: Build SafetyDays
        run: |
          xcodebuild \
            -project SafetyDays.xcodeproj \
            -scheme SafetyDays \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      # --------------------------------------------------
      # 10. 查找 APP
      # --------------------------------------------------

      - name: Locate SafetyDays.app
        run: |
          echo "Searching for SafetyDays.app..."
          find build -name "SafetyDays.app" -type d -print

      # --------------------------------------------------
      # 11. 检查 App 内部结构
      # --------------------------------------------------

      - name: Inspect SafetyDays.app contents
        run: |
          APP_PATH=$(find build \
            -type d \
            -path "*/Build/Products/Release-iphoneos/SafetyDays.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: SafetyDays.app not found."
            exit 1
          fi

          echo "============================================"
          echo "APP_PATH: $APP_PATH"
          echo "============================================"
          ls -la "$APP_PATH"
          echo "============================================"

          if [ ! -f "$APP_PATH/SafetyDays" ]; then
            echo "ERROR: SafetyDays executable NOT found in app bundle."
            ls -la "$APP_PATH"
            exit 1
          fi

          echo "Executable found:"
          file "$APP_PATH/SafetyDays"

      # --------------------------------------------------
      # 12. 创建 Payload（用 ditto 保留 metadata）
      # --------------------------------------------------

      - name: Create IPA structure
        run: |
          rm -rf Payload
          mkdir -p Payload

          APP_PATH=$(find build \
            -type d \
            -path "*/Build/Products/Release-iphoneos/SafetyDays.app" \
            -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: SafetyDays.app not found."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH"

          # 用 ditto 而不是 cp -R —— 保留 extended attributes，TrollStore 友好
          ditto "$APP_PATH" Payload/SafetyDays.app

          echo "============================================"
          echo "Payload after copy:"
          ls -la Payload/SafetyDays.app
          echo "============================================"

      # --------------------------------------------------
      # 13. 创建 IPA
      # --------------------------------------------------

      - name: Create IPA
        run: |
          rm -f SafetyDays.ipa

          /usr/bin/zip \
            -r \
            -q \
            SafetyDays.ipa \
            Payload

          echo "IPA created:"
          ls -lh SafetyDays.ipa

      # --------------------------------------------------
      # 14. 验证 IPA
      # --------------------------------------------------

      - name: Verify IPA
        run: |
          unzip -l SafetyDays.ipa

      # --------------------------------------------------
      # 15. 上传 IPA
      # --------------------------------------------------

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SafetyDays-IPA
          path: SafetyDays.ipa
          if-no-files-found: error
          retention-days: 7
